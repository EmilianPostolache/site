<svg xmlns="http://www.w3.org/2000/svg" width="560" height="410" viewBox="0 0 560 410" fill="none" role="img" aria-labelledby="title desc"><title id="title">Parallel decoding: iterate together, converge to a sequence</title><desc id="desc">Conceptual illustration of fixed-point parallel transformer decoding for translation. Autoregressive decoding commits one token after the previous token. Parallel decoding updates several token estimates from the previous iteration, repeatedly, until a fixed point is reached. The illustrative iterations are not a performance benchmark or a claim of single-pass generation.</desc>
